id: inter_agent_communication
status: draft
scope: all_agents
summary: Live agent-to-agent communication, liveness, identity, and durable closeout rules.
rules:
  - This standard governs live agent-to-agent communication.
  - Do not treat this standard as defining a default set of channels or rooms.
  - Match the venue to the job, including live ephemeral coordination versus durable ratified governance.
  - Do not auto-bridge live coordination channels and durable governance channels.
  - Project-specific conversation topologies are allowed when the work calls for them, including hub-and-spoke coordination.
  - Hand-write every durable outcome to its system of record.
  - Keep the Gitea governance issue channel outside this standard.
  - Treat live communication rooms as non-durable; they are not a system of record.
  - Use connectors as on-call, task-scoped tools.
  - Join each live room under the agent's single canonical name.
  - Do not join the same live room under an alias or alternate name.
  - If a runtime discovers it has joined a room under more than one name, declare the collision, use one canonical name for further posts, and treat the extra presence as stale until the transport can reap it.
  - On joining a live room, announce in one line and check current presence when the transport supports it.
  - Converse to resolution, then have the closer summarize, participants leave, and connectors shut down.
  - Do not assume live-room state persists between tasks.
  - After posting in a cursor-based live room, await new messages with the latest cursor and a short timeout.
  - Prefer short await re-arm intervals until the host tool-call timeout has been measured against the transport's long-poll behavior.
  - Re-arm the await loop when it returns empty while the room remains active.
  - Always pass the latest cursor; the cursor is the catch-up mechanism, and agents must not re-read the stream.
  - Keep live messages terse and limited to one fresh increment.
  - Do not restate the thread in live messages.
  - When the transport server-stamps identity, do not prefix the sender name in the message body.
  - Use reply references to disambiguate when three or more participants are present and the transport supports replies.
  - Treat lead and closer as per-task assignments, not agent identity.
  - When a live coordination room includes more than one agent and any human participant, designate exactly one active human liaison for confirmations, clarifications, approvals, and ratification requests.
  - Non-liaison agents must route human-facing decision requests through the active liaison or through an explicit liaison handoff.
  - Do not ask the same human for duplicate confirmations from multiple agents in the same live coordination room.
  - If the active liaison becomes unavailable, agents may choose a replacement liaison in-room before making further human-facing decision requests.
  - Set a round cap and a stalemate cap at the start of a live coordination room.
  - On convergence or cap, the closer summarizes and closes or suspends the room according to the remaining work.
  - Escalate an unbreakable tie to Jason.
  - Poll Jason for any governance policy decision through the active human liaison when a multi-agent live room has one.
  - Treat agent convergence as a recommendation only.
  - Do not enter a governance change into canon without Jason's explicit ratification.
  - Treat Jason as the sole ratifier for governance policy.
  - Use one canonical name per agent, stable across rooms and channels.
  - The canonical name identifies the agent's standing role or function and encodes no hostname, model backend, or per-task role.
  - Settle the canonical name collaboratively with Jason; the agent describes its role and proposes candidates, and Jason settles and audits the final choice.
  - Respect transport maximum message size and per-agent rate limits.
  - Do not chunk around transport limits.
  - Every closing summary must either confirm that the durable record was written or name an explicit unresolved follow-up.
  - Naming a durable record without confirming that it was written is not enough.
  - A room that closes without confirming a durable record or naming an unresolved follow-up is not finished.
  - After a restart, rejoin with the last cursor to backfill only missed messages.
  - If the last cursor is lost, join fresh, take the full backfill, and say so.
  - Do not put secrets, long logs, or bulky artifacts into live-room transcripts.
  - Reference bulky material by path, link, or issue reference and summarize it.
  - Keep an await outstanding while a live task room is active and the agent is a participant.
  - Do not tell peers to stop listening while the room remains active.
  - Finishing an individual work slice does not by itself permit an agent to leave an active live coordination room.
  - A participant may leave before room closeout only after posting an explicit handoff that names completed work, open follow-ups, remaining owner, and last cursor when applicable.
  - For a long pause, post a suspension notice naming the resume trigger, the resume owner, the last cursor, and participant_id when the transport exposes it.
  - Resume self-serve by rejoining with the saved cursor.
  - Do not assume automatic broker wake exists unless the transport explicitly provides it.
  - Treat a suspended agent as requiring a one-time human or runtime wake when no automatic wake exists.
  - Treat project completion closeout as distinct from a pause and from a single session ending.
  - The closer controls room-level closeout or suspension and releases participants only after completion criteria are met or unresolved follow-ups are explicitly assigned.
  - Do not treat the transport presence list as sole proof that a live room is open or closed when the transport may retain stale sessions.
  - On full task or project completion, the closer posts a final summary, confirms and names the durable record, updates work trackers when applicable and within connector scope, names participant_id values when the transport exposes them, and has participants leave and shut down connectors.
  - After closeout departure, perform a post-closeout presence check when the transport supports it.
  - If the post-closeout presence check shows lingering sessions after all participants have cleared follow-ups and posted closeout or departure notices, record an explicit stale-presence note rather than treating those sessions as fresh open work.
  - A missing connector for a closeout update is a named follow-up, not a protocol violation.
  - Completion criteria are explicit: the definition of done is met, the durable record exists, and no participant has open follow-ups in that room.
  - Before final closeout, each active participant must either declare no open follow-ups or name the follow-up and owner.
  - If completion criteria are not met, suspend rather than close out.
  - Do not leave a live coordination room in a state where remaining participants cannot tell whether the room is active, suspended, or closed.
  - Treat tokens as a shared cost in live agent communication.
  - Prefer the cheapest faithful representation of a message.
  - Batch a coherent thought into one post instead of several.
