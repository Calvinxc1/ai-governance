id: gmail_boundary
status: ratified
scope: desktop_orchestrators
summary: Desktop-orchestrator Gmail boundary.
bucket: A_hard_invariants
rules:
  - Gmail access is read-only.
  - For Gmail, search and read only.
  - Never create, send, draft, label, archive, move, trash, mark spam, or delete in Gmail.
  - If a desktop connector exposes Gmail write tools, treat that as a capability regression and report it before using Gmail.
