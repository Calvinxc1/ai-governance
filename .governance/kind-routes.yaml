id: kind_routes
status: active
kind: desktop_orchestrator
default_load:
  - .governance/policies/desktop-role.yaml
route_resolution:
  - Load default_load after the base task map default_load.
  - Select every kind route that matches the task shape.
  - For each selected kind route, load every file in the named groups plus every direct file listed under files.
  - Do not infer kind policy loading from folder names; route_groups and routes are the explicit kind loading contract.
route_groups:
  desktop.role:
    - .governance/policies/desktop-role.yaml
  desktop.correspondence:
    - .governance/policies/style.yaml
    - .governance/policies/outbound-correspondence.yaml
  desktop.creative:
    - .governance/policies/desktop-role.yaml
    - .governance/policies/knowledge-model.yaml
  desktop.wellbeing:
    - .governance/policies/engagement-posture.yaml
  desktop.co_work_sync:
    - .governance/policies/desktop-role.yaml
    - .governance/policies/workflow-auditability.yaml
    - .governance/policies/co-work-sync.yaml
  desktop.gmail:
    - .governance/policies/gmail-boundary.yaml
routes:
  planning_session:
    groups:
      - desktop.role
    files: []
  correspondence_session:
    groups:
      - desktop.correspondence
    files: []
  gmail_session:
    groups:
      - desktop.gmail
    files: []
  creative_session:
    groups:
      - desktop.creative
    files: []
  wellbeing_sensitive_session:
    groups:
      - desktop.wellbeing
    files: []
  substantive_orchestration:
    groups:
      - desktop.role
    files: []
  co_work_sync:
    groups:
      - desktop.co_work_sync
    files: []
