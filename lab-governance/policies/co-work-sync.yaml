id: co_work_sync
status: ratified
scope: desktop_orchestrator
summary: Sync, portability, and auditability rules for Claude co-work folders.
applicability:
  - Applies only to desktop-orchestrator co-work agents and their co-work folders.
  - Does not govern coding agents, source repositories, implementation worktrees, or ordinary project Git workflows.
  - Does not replace repository-local governance for coding work.
principles:
  - Co-work folders optimize for near-realtime portability across Jason's hosts.
  - Git provides background local history, auditability, recovery, and optional durable backup.
  - Gitea is a durable remote and review surface, not the default realtime sync mechanism.
  - File replication and Git history are separate responsibilities.
  - Routine co-work Git operations are an agent-managed backup mechanism, not a user-facing decision loop.
default_profile:
  name: cowork-realtime
  rules:
    - Use Seafile or an equivalent file-sync substrate for near-realtime folder portability.
    - Maintain a local Git repository inside or alongside each governed co-work folder.
    - Prefer aggressive local commits over relying on filesystem sync alone.
    - Do not require a Gitea remote for basic co-work operation.
    - Do not treat successful file sync as durable governance capture.
profiles:
  cowork-realtime:
    summary: Seafile-backed portability with aggressive local Git history.
    remote_required: false
  cowork-durable:
    summary: Realtime folder sync plus periodic push to a private Gitea repository.
    remote_required: true
    remote_visibility: private
  cowork-governed:
    summary: Durable co-work folder with structured commits and explicit governance records.
    remote_required: true
    remote_visibility: private
    additional_rules:
      - Use structured commit messages when the change records a decision, handoff, or governance-relevant state.
      - Link durable decisions to the appropriate system of record when one exists.
initialization_rules:
  - A co-work agent may initialize local Git for a co-work folder only when the folder is classified as a co-work folder and not a coding worktree.
  - Before initializing, the agent must check whether the folder or any parent folder is already inside a Git repository.
  - If the folder is already inside a Git repository, the agent must not run `git init`; it must report the existing repository boundary.
  - If no repository exists, the agent may run `git init` only under an approved co-work sync profile.
  - The agent must create or update ignore rules before the first commit.
  - The first commit must capture baseline non-ignored co-work state.
  - The initial commit message must identify that the repository was agent-initialized and name the active co-work sync profile.
  - The agent must not add a Gitea remote unless the folder has been classified for remote durability.
  - The agent must not push the initial repository to Gitea without explicit Jason approval or an already-approved durable profile.
  - After successful initialization, the agent should not interrupt Jason with routine Git mechanics unless the active task already calls for a setup report.
  - The agent must surface initialization only when classification, ignore rules, remote safety, sensitive content, repository-boundary detection, or first-commit creation is blocked, risky, or requires Jason approval.
git_rules:
  - Treat routine local Git commits as silent background backup and audit work.
  - Do not ask Jason whether to commit, what to include in a routine commit, how to structure routine commits, or what routine commit message to use.
  - The agent has discretion over routine local commit timing, grouping, included non-ignored files, and commit messages within the active co-work folder.
  - Auto-commit dirty co-work folders aggressively.
  - Commit before agent handoff when feasible.
  - Commit after task completion or suspension.
  - Commit before destructive, bulk, or uncertain changes.
  - Commit periodically while dirty during active work.
  - A reasonable default periodic interval is 5 to 15 minutes.
  - Use clear machine-generated commit messages that identify trigger, agent, host when appropriate, and timestamp.
  - Routine successful commits require no immediate user-facing report.
  - Report Git activity only when requested by Jason, when the task itself is a Git/audit review, or when something is wrong, blocked, risky, remote-sensitive, conflict-related, or approval-gated.
  - Do not rewrite co-work Git history automatically.
  - Do not auto-resolve Git conflicts.
  - On conflict, stop automation for the affected folder and create a visible conflict notice for Jason or the active co-work coordinator.
gitea_rules:
  - Gitea remotes are allowed for backup, review, inspection, and durable portability.
  - Gitea must not be assumed to provide Seafile-like realtime synchronization.
  - Pushing to Gitea requires the folder to be classified as safe for that remote.
  - Private Gitea remotes are the default for co-work folders.
  - Public remotes require explicit Jason approval.
  - Agents must not push secrets, credentials, connector tokens, private logs, or unreviewed sensitive transcripts.
sync_substrate_rules:
  - Seafile or equivalent file sync may remain the primary cross-host transport.
  - If the Git metadata directory is synced directly, agents must treat concurrent writers as higher risk.
  - If Git metadata is excluded from sync, each host may maintain its own local repository history over the synced working files.
  - Avoid concurrent automated Git operations from multiple hosts against the same synced `.git` directory unless a lock discipline exists.
coding_boundary:
  - Co-work Git initialization rules do not authorize agents to initialize, modify, or reconfigure Git repositories used for coding work.
  - If a co-work folder contains source code, scripts, or generated implementation artifacts, the agent must classify whether it is still a co-work folder before applying this policy.
ignore_rules:
  - Co-work repositories must ignore secrets, credentials, tokens, caches, model scratch, bulky generated logs, transient sockets, lock files, and host-local runtime state.
  - Ignore rules should be explicit and reviewed before enabling Gitea push.
  - When in doubt, preserve the file locally but exclude it from Git until Jason classifies it.
failure_rules:
  - If sync, commit, or push automation fails repeatedly, preserve the working files and stop escalating automation.
  - Do not delete local state to repair sync automatically.
  - Do not force-push unless Jason explicitly authorizes it for the affected co-work repository.
  - Record unresolved sync failures in a visible handoff note.
acceptance:
  - A co-work folder is considered portable when current working files replicate across intended hosts.
  - A co-work folder is considered auditable when local Git history captures meaningful recent states.
  - A co-work folder is considered durable only when its classified contents have been pushed to an approved remote or otherwise written to an approved durable system of record.
