parent:
  branch: baseline/coding-agent/main
  canon_version: baseline/coding-agent/main
  summary: Coding-agent contract for software engineering, GitFlow, review, documentation
    drift, and commit discipline.
narrative_blurb: Baseline Factorio modding agents inherit coding-agent discipline
  and add Factorio lifecycle, prototype, dependency, release, changelog, and local
  workflow/status rules.
orientation:
  consumes_layer: baseline/factorio-modding-agent/main
  full_picture_branch: true
  inheritance_model: baseline/coding-agent/main is merged down into this branch after
    Jason ratifies baseline coding-agent or trunk changes.
  versioning_model: The versioned branch path is the active governance version; canon_version
    mirrors that branch path.
  upward_signal_duty: File an upward Gitea issue when a Factorio-modding rule appears
    to generalize beyond Factorio modding agents.
  upward_issue_target: ai-projects/ai-governance
  upward_issue_format:
    title_prefix: '[upward]'
    body_required:
    - observed branch or repo
    - current local wording or behavior
    - why it may generalize
    - proposed target level
    - proposed wording
