id: task_map
default_load:
  - AGENTS.md
  - lab-governance/policies/universal.yaml
  - lab-governance/policies/enforcement-model.yaml
  - lab-governance/policies/runtime-surface-adapter.yaml
  - lab-governance/policies/hard-invariant-index.yaml
route_resolution:
  - Load default_load first.
  - Select every route that matches the task shape.
  - Select `live_agent_coordination` for any task where the agent can join, create, monitor, coordinate in, invite another agent to, or close out a live coordination room.
  - Select `live_room_relay` when the agent cannot join or monitor a live room and is asked to write ready-to-use room-start, invite, or relay text for an agent that can.
  - For each selected route, load every file in the named groups plus every direct file listed under files.
  - Do not infer policy loading from folder names; route_groups and routes are the explicit loading contract.
route_groups:
  governance.enforcement:
    - lab-governance/policies/enforcement-model.yaml
    - lab-governance/policies/runtime-surface-adapter.yaml
    - lab-governance/policies/hard-invariant-index.yaml
  execution.standard:
    - lab-governance/policies/execution-control.yaml
    - lab-governance/policies/request-elicitation.yaml
    - lab-governance/policies/epistemic-acceptance.yaml
  communication.inter_agent:
    - lab-governance/policies/inter-agent-communication.yaml
  communication.live_room:
    - lab-governance/policies/inter-agent-communication.yaml
    - lab-governance/policies/live-room-capable.yaml
    - lab-governance/policies/agent-identity.yaml
    - lab-governance/policies/live-room-coordination.yaml
    - lab-governance/policies/live-room-closeout.yaml
  communication.live_room_relay:
    - lab-governance/policies/inter-agent-communication.yaml
    - lab-governance/policies/live-room-relay.yaml
  connector.boundaries:
    - lab-governance/policies/boundaries.yaml
  safety.validation:
    - lab-governance/policies/risk-validation.yaml
  workflow.auditability:
    - lab-governance/policies/workflow-auditability.yaml
  governance.update:
    - lab-governance/policies/execution-control.yaml
    - lab-governance/policies/epistemic-acceptance.yaml
    - lab-governance/processes/agent-governance-update.yaml
  governance.override:
    - lab-governance/processes/override-governance.yaml
    - lab-governance/overrides/policy-overrides-spec.yaml
    - lab-governance/overrides/policy-overrides.yaml
routes:
  discussion_or_planning:
    groups:
      - governance.enforcement
      - execution.standard
      - communication.inter_agent
    files: []
  substantive_work:
    groups:
      - governance.enforcement
      - execution.standard
      - safety.validation
      - workflow.auditability
    files: []
  connector_or_boundary_work:
    groups:
      - governance.enforcement
      - connector.boundaries
    files: []
  live_agent_coordination:
    groups:
      - governance.enforcement
      - communication.live_room
    files: []
  live_room_relay:
    groups:
      - governance.enforcement
      - communication.live_room_relay
    files: []
  inter_agent_communication_index:
    groups: []
    files:
      - lab-governance/policies/inter-agent-communication.yaml
  knowledge_capture:
    groups:
      - workflow.auditability
    files:
      - lab-governance/policies/knowledge-model.yaml
  style_sensitive_output:
    groups: []
    files:
      - lab-governance/policies/style.yaml
  wellbeing_or_pushback:
    groups: []
    files:
      - lab-governance/policies/engagement-posture.yaml
  policy_edit:
    groups: []
    files:
      - lab-governance/processes/policy-maintenance.yaml
  guarded_domain_action:
    groups:
      - governance.enforcement
    files:
      - lab-governance/policies/hard-invariants.yaml
  agent_governance_update:
    groups:
      - governance.update
    files: []
  override_execution:
    groups:
      - governance.override
    files: []
