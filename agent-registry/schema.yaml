id: agent_registry_schema
status: active
summary: Schema for the central ai-governance agent-version registry.
row_key: agents
required_fields:
  - canonical_agent_name
  - agent_kind
  - active_governance_branch
  - target_governance_commit
  - current_governance_commit
  - generalized_governance_commit
  - source_repository_or_path
  - status
  - last_confirmed_date
  - confirmed_by
  - self_stamp_path
  - notes
status_enum:
  - current
  - behind
  - drifted
  - unknown
  - retired
field_definitions:
  canonical_agent_name: Stable canonical name for the agent.
  agent_kind: Governance kind the agent consumes.
  active_governance_branch: Branch the agent should use for its active governance copy.
  target_governance_commit: Intended governance commit for the agent.
  current_governance_commit: Governance commit the agent is currently confirmed to run.
  generalized_governance_commit: Generalized lab-governance commit the agent is confirmed to carry, when separately tracked.
  source_repository_or_path: Repository, branch, path, or URI for the agent governance source.
  status: One of current, behind, drifted, unknown, or retired.
  last_confirmed_date: Date this row was last confirmed, YYYY-MM-DD, or null when unknown.
  confirmed_by: Person or agent that confirmed this row, or null when unknown.
  self_stamp_path: Path or URI to the agent's local self-stamp, or null when unknown.
  notes: Short context for uncertainty, drift, or reconciliation state.
null_allowed:
  - agent_kind
  - active_governance_branch
  - target_governance_commit
  - current_governance_commit
  - generalized_governance_commit
  - source_repository_or_path
  - last_confirmed_date
  - confirmed_by
  - self_stamp_path
validation_rules:
  - Each row must contain exactly the required fields.
  - status must be one of status_enum.
  - Use null instead of invented data when a value is not attested.
  - If status is current, current_governance_commit and target_governance_commit should match unless notes explain the exception.
  - A mismatch between this registry and an agent self-stamp is drift and must be routed to Jason through the active human liaison.
