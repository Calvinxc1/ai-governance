id: agent_registry_schema
status: legacy
summary: Historical schema for legacy ai-governance agent-version registry rows. Current governed workspace status belongs in `.governance/local/status.yaml`.
row_key: agents
required_fields:
  - canonical_agent_name
  - agent_kind
  - active_governance_branch
  - current_governance_commit
  - target_governance_commit
  - target_active_canon_version
  - current_active_canon_version
  - target_generalized_canon_version
  - current_generalized_canon_version
  - canon_version_log_ref
  - source_repository_or_path
  - status
  - last_confirmed_date
  - confirmed_by
  - self_stamp_path
  - notes
status_enum:
  - active
  - current
  - behind
  - drifted
  - unknown
  - retired
field_definitions:
  canonical_agent_name: Stable canonical name for the agent.
  agent_kind: Governance kind the agent consumes.
  active_governance_branch: Branch the agent should use for its active governance copy.
  current_governance_commit: Commit the agent is currently confirmed to use for its active governance copy, or null when unknown.
  target_governance_commit: Commit the agent should target for its active governance copy, or null when unknown.
  target_active_canon_version: Intended active branch or kind canon_version for the agent.
  current_active_canon_version: Active branch or kind canon_version the agent is currently confirmed to run.
  target_generalized_canon_version: Intended trunk-general canon_version for the agent.
  current_generalized_canon_version: Trunk-general canon_version the agent is currently confirmed to run.
  canon_version_log_ref: Reference into canon-version-log for audit provenance, or null when unknown.
  source_repository_or_path: Repository, branch, path, or URI for the agent governance source.
  status: One of active, current, behind, drifted, unknown, or retired.
  last_confirmed_date: Date this row was last confirmed, YYYY-MM-DD, or null when unknown.
  confirmed_by: Person or agent that confirmed this row, or null when unknown.
  self_stamp_path: Path or URI to the agent's legacy local self-stamp or current `.governance/local/status.yaml`, or null when unknown.
  notes: Short context for uncertainty, drift, or reconciliation state.
null_allowed:
  - agent_kind
  - active_governance_branch
  - current_governance_commit
  - target_governance_commit
  - target_active_canon_version
  - current_active_canon_version
  - target_generalized_canon_version
  - current_generalized_canon_version
  - canon_version_log_ref
  - source_repository_or_path
  - last_confirmed_date
  - confirmed_by
  - self_stamp_path
validation_rules:
  - Each row must contain exactly the required fields.
  - status must be one of status_enum.
  - Use active when the row is a lifecycle activation record requested by Jason rather than a version-drift state.
  - Use null instead of invented data when a value is not attested.
  - Drift detection keys on explicit canon_version labels only.
  - Commit SHA, branch tip, merge status, file timestamp, and deployment state are not governance versions.
  - A major-level gap between current and target canon_version flips status to behind or drifted and routes to Jason through the active human liaison.
  - Minor-level and patch-level gaps are visible version differences but do not by themselves raise an alarm status.
  - If status is current, current and target major versions should match for both active and generalized canon_version labels unless notes explain the exception.
  - Commit SHA references are provenance only, not indicators of governance version.
  - A mismatch between this legacy registry and local status must be reported to Jason through the active human liaison; the registry does not override `.governance/local/status.yaml`.
